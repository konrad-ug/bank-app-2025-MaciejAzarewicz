name: Unit tests

on:
  push:
    branches: [ main, lab4, lab4-ci-history ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        python3 -m coverage run --source=src -m pytest
        python3 -m coverage report
        python3 -m coverage html

    - name: Fail if coverage is below 100%
      run: |
        coverage_value=$(python3 -m coverage report | tail -n 1 | awk '{print $4}' | sed 's/%//')
        echo "Coverage is $coverage_value%"
        if [ "$coverage_value" -lt 100 ]; then
          echo "❌ Coverage below 100%!"; exit 1;
        fi
